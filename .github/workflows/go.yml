name: Go
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Check module dependencies
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - run: go vet ./...
      - name: Unit tests, race detection and coverage
        run: go test -race -coverprofile=coverage.out ./...
      - name: Check coverage
        run: |
          go tool cover -func=coverage.out | tee coverage.txt
          awk '$1 == "total:" { sub(/%$/, "", $3); found=1; if ($3+0 < 95) exit 1 } END { if (!found) exit 1 }' coverage.txt
          awk '$NF == "0.0%" { print "Untested function: " $0; failed=1 } END { exit failed }' coverage.txt
          go tool cover -html=coverage.out -o=coverage.html
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: |
            coverage.out
            coverage.txt
            coverage.html
      - run: go build ./...
